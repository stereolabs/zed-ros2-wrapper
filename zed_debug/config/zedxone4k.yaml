# config/zedxone4k.yaml
# Parameters for Stereolabs ZED X One 4K camera
---
/**:
    ros__parameters:
        general:
          camera_model: 'zedxone4k'
          camera_name: 'zedxone4k' # overwritten by launch file
          grab_resolution: 'HD1200' # The native camera grab resolution. 'HD4K', 'QHDPLUS', 'HD1200', 'HD1080', 'AUTO'
          grab_frame_rate: 30 # ZED SDK internal grabbing rate (HD4K/QHDPLUS: 15 - HD1200/HD1080: 60, 30, 15)

        video:
          enable_hdr: false # When set to true, the camera is set in HDR mode. HDR is available with 'HD1200' and 'QHDPLUS', and 'QHDPLUS' is only available in HDR mode

