# config/zedxhdrmax.yaml
# Parameters for Stereolabs ZED X HDR MAX camera
---
/**:
    ros__parameters:
        general:
          camera_model: 'zedxhdrmax'
          camera_name: 'zedxhdrmax' # overwritten by launch file
          grab_resolution: 'HD1536' # The native camera grab resolution. 'HD1536', 'XVGA', 'TXGA', 'AUTO'
          grab_frame_rate: 30 # ZED SDK internal grabbing rate (HD1536: 30, XVGA: 30, TXGA: 30)

        video:
          exposure_time: 16000 # Defines the real exposure time in microseconds. Range [100-33000]. Recommended to control manual exposure (instead of `video.exposure` setting)
          analog_gain: 1255 # Defines the real analog gain (sensor) in mDB. Range [0-30000]. Recommended to control manual sensor gain (instead of `video.gain` setting)
          digital_gain: 0 # Defines the real digital gain (ISP) in mDB. Range [0-5000]. Recommended to control manual ISP gain (instead of `video.gain` setting)

        depth:
          min_depth: 0.01 # Min: 0.01, Max: 3.0
          max_depth: 20.0 # Min: 0.5, Max: 25.0 (40.0 with the 4 mm lens)

